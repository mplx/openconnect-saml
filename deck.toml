[package]
name = "ocsaml"
version = "0.5.0"
description = "Connect to a Cisco AnyConnect gateway that authenticates with SAML/SSO, using your ordinary desktop browser and plain openconnect."
license = "LGPL-3.0-only"
authors = ["mplx <developer@mplx.eu>"]
keywords = ["vpn", "anyconnect", "saml", "sso", "openconnect", "cisco"]
capabilities = ["net", "exec"]
bin = "bin/ocsaml"

[package.urls]
deck = "https://raw.githubusercontent.com/mplx/openconnect-saml/main/deck.toml"
homepage = "https://github.com/mplx/openconnect-saml"

[engines]
jennifer = ">=0.25.0"

