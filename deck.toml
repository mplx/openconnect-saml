[package]
name = "openconnect-saml"
version = "0.3.0"
description = "Connect to a Cisco AnyConnect gateway that authenticates with SAML/SSO, using your ordinary desktop browser and plain openconnect."
license = "LGPL-3.0-only"
authors = ["mplx <developer@mplx.eu>"]
keywords = ["vpn", "anyconnect", "saml", "sso", "openconnect", "cisco"]

# Host capabilities the code needs, matching the `# pragma-jennifer-capability`
# lines in bin/openconnect-saml and src/saml.j. `net` is the <config-auth>
# exchange with the gateway and the CDP connection to the browser; `exec` is
# every subprocess this program drives - openconnect itself, the browser, and
# the id / getent / sudo lookups behind the privilege handoff.
capabilities = ["net", "exec"]

# openconnect-saml is an *app*, not a deck: an unscoped name and a runnable
# entry script, so `jvc app install` puts it on PATH rather than vendoring it,
# and `jvc publish` would refuse it (a published deck must be scoped). The entry
# is a five-line shell around src/saml.j, which it imports relatively, so the
# whole tree has to be unpacked together - which is what an app install does.
bin = "bin/openconnect-saml"

# Project URLs by role. `deck` (this manifest's own location) is mandatory;
# `homepage` and `manual` are optional.
[package.urls]
deck = "https://raw.githubusercontent.com/mplx/openconnect-saml/main/deck.toml"
homepage = "https://github.com/mplx/openconnect-saml"

# The interpreter floor - a floor, not a caret: the oldest build that runs this
# program. Every .j file repeats it in its "# pragma-jennifer-version:" line,
# and the two copies have to stay in step.
#
# jennifer-tiny is absent by design: this needs `exec` to drive openconnect and
# a browser, and `net` for the gateway exchange.
[engines]
jennifer = ">=0.25.0"

# Runtime requirements: deck = version constraint, registry decks only, and they
# must be scoped. There are none - every import (http.j, uri.j, args.j, html.j,
# websocket.j) is a bundled stdlib module, so the engine requirement above is
# the whole dependency story.
[decks]
